onboarding = false
[theme]
name = "dracula"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui]
# Always frame panes, including a lone pane
pane_borders = "always"
pane_outer_borders = true
pane_gaps = false

status_indicators = "symbols"
[keys]
prefix = "ctrl+a"

# Built-ins moved to shift so herdr-nvim can use prefix+e / prefix+o
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"

# Resize mode: prefix, then r, then arrows
resize_mode = "prefix+r"

# Workspace / tab switching: Ctrl+Option + hjkl, no prefix
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"

# Jump to workspace N: prefix, then shift+1..9
switch_workspace = "prefix+shift+1..9"

# Direct resize, no mode needed
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_right = "ctrl+shift+alt+right"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_down = "ctrl+shift+alt+down"

# Reorder the active tab: toward the front / back
move_tab_previous = "prefix+shift+h"
move_tab_next = "prefix+shift+l"

# Reorder the active workspace: prefix, then u (up) / d (down)
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "$HOME/Data/projects/personal/dotfiles/bin/herdr-ws-move up"
description = "move workspace up"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "$HOME/Data/projects/personal/dotfiles/bin/herdr-ws-move down"
description = "move workspace down"

# Pick a pane in the current tab with fzf: prefix, then f
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/Data/projects/personal/dotfiles/bin/herdr-pane-pick"
description = "pick pane"
width = 60
height = 12

# lazygit in a popup, opened in the active pane's cwd: prefix, then g
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd \"$($HOME/.local/bin/herdr pane get \"$HERDR_ACTIVE_PANE_ID\" | /opt/homebrew/bin/jq -r '.result.pane.foreground_cwd // .result.pane.cwd')\" && /opt/homebrew/bin/lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# Rotate the split around the active pane (side-by-side <-> stacked): prefix, then space
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "$HOME/Data/projects/personal/dotfiles/bin/herdr-pane-rotate"
description = "rotate pane split"

# Swap the active pane with its neighbor: prefix, then alt+arrows (kitty owns shift+arrows)
[[keys.command]]
key = "prefix+alt+left"
type = "shell"
command = "$HOME/.local/bin/herdr pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction left"
description = "swap pane left"

[[keys.command]]
key = "prefix+alt+down"
type = "shell"
command = "$HOME/.local/bin/herdr pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction down"
description = "swap pane down"

[[keys.command]]
key = "prefix+alt+up"
type = "shell"
command = "$HOME/.local/bin/herdr pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction up"
description = "swap pane up"

[[keys.command]]
key = "prefix+alt+right"
type = "shell"
command = "$HOME/.local/bin/herdr pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction right"
description = "swap pane right"

[ui.toast]
delivery = "herdr"

# herdr-nvim: nvim sidebar (prefix, then e) and agent-file picker (prefix, then o)
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
